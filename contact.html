
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title data-lang="contact_title"><span data-lang="contact_title">Contact FutureMind Lab</span></title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#080d1c;
color:white;
font-family:Arial;
padding:40px;
}

.container{
max-width:700px;
margin:auto;
text-align:center;
}

.card{
background:#121a33;
padding:35px;
border-radius:20px;
}

input,textarea{

width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:none;

}

button{

padding:14px 35px;
border-radius:30px;
background:#00d9ff;
border:none;
font-weight:bold;

}

h1{
color:#00d9ff;
}

</style>

</head>


<body>


<div class="container">


<h1>
Contact FutureMind Lab
</h1>


<p>
<span data-lang="contact_text">Connect with our team and explore future digital solutions.</span>
</p>



<div class="card">


<h2>
<span data-lang="get_in_touch">Get In Touch</span>
</h2>


<input data-lang-placeholder="your_name" placeholder="Your Name">


<input data-lang-placeholder="your_email" placeholder="Your Email">


<textarea data-lang-placeholder="your_message" placeholder="Your Message"></textarea>


<br>


<button>
<span data-lang="send_message">Send Message</span>
</button>


</div>


<br>


<a href="index.html">
<span data-lang="back_home">Back To FutureMind Lab</span>
</a>


</div>

<script src="/js/language_engine.js"></script>
<script src="/js/language_switcher.js"></script>

</body>

</html>
