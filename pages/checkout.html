<script>
/* R86.70 — Checkout lower UI visibility guard */
(function () {

    function ensureCheckoutMarketInfo() {

        const info = document.getElementById("market-info");
        const card = document.querySelector(".checkout-card");

        if (!info || !card) {
            return;
        }

        /*
         * Keep the market information immediately after the checkout card.
         * Do not duplicate it.
         */
        info.style.display = "block";
        info.style.visibility = "visible";
        info.style.opacity = "1";
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            ensureCheckoutMarketInfo
        );
    } else {
        ensureCheckoutMarketInfo();
    }

})();
</script>

<script>
/* R86.75 — Checkout lower UI language refresh */
(function () {

    function refreshCheckoutMarketLabels() {

        if (!window.futuremindLanguage) {
            return;
        }

        const priceEl =
            document.getElementById("market-price");

        const paymentEl =
            document.getElementById("payment-method");

        if (!priceEl && !paymentEl) {
            return;
        }

        const product =
            window.selectedProduct;

        const market =
            window.market ||
            localStorage.getItem("futuremind_market") ||
            "global";

        const marketData =
            product &&
            product.markets ?
            product.markets[market] :
            null;

        if (!marketData) {
            return;
        }

        if (priceEl) {
            priceEl.innerText =
                window.futuremindLanguage.t("total_price") +
                ": " +
                marketData.price +
                " " +
                marketData.currency;
        }

        if (paymentEl) {
            paymentEl.innerText =
                window.futuremindLanguage.t("payment_method") +
                ": " +
                marketData.payment;
        }
    }

    window.refreshCheckoutMarketLabels =
        refreshCheckoutMarketLabels;

    function installLanguageRefreshHook() {

        if (!window.futuremindLanguage) {
            return false;
        }

        if (window.futuremindLanguage.__checkoutR8675Hook) {
            return true;
        }

        const originalChange =
            window.futuremindLanguage.change;

        if (typeof originalChange !== "function") {
            return false;
        }

        window.futuremindLanguage.change =
            async function (lang) {

                const result =
                    await originalChange.call(this, lang);

                refreshCheckoutMarketLabels();

                return result;
            };

        window.futuremindLanguage.__checkoutR8675Hook = true;

        refreshCheckoutMarketLabels();

        return true;
    }

    let attempts = 0;

    const timer = setInterval(function () {

        attempts++;

        if (installLanguageRefreshHook()) {
            clearInterval(timer);
            return;
        }

        if (attempts >= 100) {
            clearInterval(timer);
        }

    }, 50);

})();
</script>
