<script>
/* R69.4 — Market-aware pricing */
(function () {

    const PRICE_MAP = {
        global: {
            price: 49,
            currency: "USD"
        },
        iran: {
            price: 990000,
            currency: "IRR"
        }
    };

    function renderMarketPrice() {
        const market =
            localStorage.getItem("market") || "global";

        const config =
            PRICE_MAP[market] || PRICE_MAP.global;

        const priceEl =
            document.querySelector(".price");

        if (!priceEl) return;

        if (config.currency === "IRR") {
            priceEl.textContent =
                Number(config.price).toLocaleString("en-US")
                + " "
                + config.currency;
        } else {
            priceEl.textContent =
                "$" + config.price;
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            renderMarketPrice
        );
    } else {
        renderMarketPrice();
    }

})();
</script>
