<h2>🎉 Your Product Is Ready</h2>

<p>
Thank you for your purchase.
Your download is available below:
</p>

<a 
id="downloadBtn"
href="#"
class="btn">
⬇ Download Hunter-X V44 Professional
</a>


<script>

async function loadDownload(){

    const token = new URLSearchParams(
        window.location.search
    ).get("token");


    if(token){

        localStorage.setItem(
            "download_token",
            token
        );

        document.getElementById("downloadBtn").href =
        "download.html?token=" + token;

    } else {

        const savedToken =
        localStorage.getItem("download_token");

        if(savedToken){

            document.getElementById("downloadBtn").href =
            "download.html?token=" + savedToken;

        } else {

            document.getElementById("downloadBtn").innerHTML =
            "Download link unavailable";

        }

    }

}

loadDownload();

</script>
